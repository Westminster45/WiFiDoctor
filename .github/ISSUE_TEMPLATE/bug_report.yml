name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did WiFi Doctor do, and what did you expect it to do?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Click …
  - type: input
    id: app-version
    attributes:
      label: WiFi Doctor version
      description: Shown at the bottom of the window.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: diagnosis
    attributes:
      label: Diagnosis shown
      description: The one-sentence message WiFi Doctor showed, if any. Do not paste the saved report, IP addresses or network names, as issues are public.
