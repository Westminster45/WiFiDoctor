# Builds the app and runs the tests on every push to main and every pull request,
# except changes that only touch text files.
name: Swift

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
