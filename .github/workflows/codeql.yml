# GitHub's CodeQL security scan of the Swift code and of the workflow files,
# once a week and on every pull request (except pull requests that only touch
# text files).
name: CodeQL

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Build
        run: swift build
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
